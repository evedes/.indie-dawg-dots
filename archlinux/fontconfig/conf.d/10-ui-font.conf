<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- token: font.ui / font.mono (see theme/tokens.lua) -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Berkeley Mono</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>
  <!-- token: font.icons: when UI text contains an icon glyph, take it from the
       dedicated symbol font rather than whichever Nerd Font fontconfig finds first -->
  <alias binding="strong">
    <family>Adwaita Sans</family>
    <accept>
      <family>Symbols Nerd Font</family>
    </accept>
  </alias>
</fontconfig>

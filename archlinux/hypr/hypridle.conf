general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

# Dim the internal backlight shortly before locking. brightnessctl's saved state
# is restored as soon as activity resumes; machines without a backlight ignore it.
listener {
    timeout = 540
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Lock after 10 minutes without powering down displays or suspending the host.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

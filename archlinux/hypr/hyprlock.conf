general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(111111ff)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eeeeeeff)
    font_size = 72
    font_family = Adwaita Sans
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(c8c8c8ff)
    font_size = 20
    font_family = Adwaita Sans
    position = 0, 115
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(b0b0b0cc)
    inner_color = rgba(1a1a1acc)
    font_color = rgba(eeeeeeff)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL</i>
    rounding = 12
    position = 0, -20
    halign = center
    valign = center
}

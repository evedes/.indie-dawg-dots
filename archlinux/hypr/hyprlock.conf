# Tokens from theme/tokens.lua (see ~/Multiverse/hyprland-desktop-design-system.md)

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(1a1a1aff)        # bg.base
}

# Clock: display size, not a token
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e6e6e6ff)        # fg.primary
    font_size = 72
    font_family = Adwaita Sans    # font.ui
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a5a5a5ff)        # fg.secondary
    font_size = 20
    font_family = Adwaita Sans    # font.ui
    position = 0, 115
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 1         # border.width
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(ffffff47)  # border.active
    inner_color = rgba(242424e6)  # bg.elevated
    font_color = rgba(e6e6e6ff)   # fg.primary
    check_color = rgba(7e9cd8ff)  # accent
    fail_color = rgba(e46876ff)   # danger
    fade_on_empty = false
    placeholder_text = <span foreground="##a5a5a5">Password…</span>
    fail_text = <i>$FAIL</i>
    rounding = 12                 # radius.popup
    position = 0, -20
    halign = center
    valign = center
}
